services:
  openmaic:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    ports:
      - "10051:10050"
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
      HOSTNAME: 0.0.0.0
      PORT: 10050
      NEXT_TELEMETRY_DISABLED: "1"
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      DEFAULT_IMAGE_PROVIDER: ${DEFAULT_IMAGE_PROVIDER:-siliconflow-image}
      DEFAULT_IMAGE_MODEL: ${DEFAULT_IMAGE_MODEL:-Qwen/Qwen-Image}
    volumes:
      - .:/app
      - openmaic-node-modules:/app/node_modules
      - openmaic-next-cache:/app/.next
      - openmaic-pnpm-store:/pnpm/store
    command: >
      sh -lc "pnpm config set store-dir /pnpm/store &&
      pnpm config set registry https://registry.npmmirror.com &&
      pnpm install --frozen-lockfile &&
      pnpm dev:docker"

volumes:
  openmaic-node-modules:
  openmaic-next-cache:
  openmaic-pnpm-store:
