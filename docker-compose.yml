services:
  openmaic:
    build:
      context: .
      args:
        NEXT_PUBLIC_MAIC_EDITOR_ENABLED: ${NEXT_PUBLIC_MAIC_EDITOR_ENABLED:-1}
    mem_limit: 1g
    memswap_limit: 1g
    ports:
      - "0.0.0.0:10051:10050"
    env_file:
      - .env.local
    volumes:
      # Optional: mount server-providers.yml for provider config
      # - ./server-providers.yml:/app/server-providers.yml:ro
      - openmaic-data:/app/data
    restart: unless-stopped

volumes:
  openmaic-data:
